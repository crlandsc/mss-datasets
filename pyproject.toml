[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mss-datasets"
version = "0.2.0"
description = "Aggregate multiple MSS datasets into unified stem folders"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "soundfile>=0.12",
    "numpy>=1.21",
    "pyyaml>=6.0",
    "unidecode>=1.3",
    "tqdm>=4.60",
    "click>=8.0",
    "python-dotenv>=0.19",
    "moises-db @ git+https://github.com/moises-ai/moises-db.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
mss-datasets = "mss_datasets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The instrument mapping and override tables are loaded at runtime relative to
# the package directory, so they must ship inside the wheel. Without this a
# pip-installed copy raises FileNotFoundError on the first MedleyDB track.
[tool.setuptools.package-data]
"mss_datasets.mapping" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
